<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fff5f5, #ffe4e4);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        /* College Logo */
        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .college-name {
            color: #b30000;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .input-box {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-box:focus {
            border-color: #b30000;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #b30000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #8f0000;
        }

        .forgot {
            display: block;
            margin-top: 15px;
            color: #b30000;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <!-- College Logo -->
        <img src="logo.png" alt="Adhiparasakthi Engineering College Logo" class="logo">

        <div class="college-name">
            ADHIPARASAKTHI ENGINEERING COLLEGE
        </div>

        <div class="subtitle">
            Melmaruvathur
        </div>

        <h2>Login</h2>

        <form>
            <input
                type="text"
                class="input-box"
                placeholder="Username / Register Number"
                required
            >

            <input
                type="password"
                class="input-box"
                placeholder="Password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <a href="#" class="forgot">Forgot Password?</a>

        <div class="footer">
            © 2026 Adhiparasakthi Engineering College
        </div>

    </div>

</body>
</html>
